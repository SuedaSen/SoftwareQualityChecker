ml.status.off=Similarity in this analysis: computed with TF-IDF (ML fallback)

about.ml.title=What is ML? — Short explanation from scratch
about.ml.def=ML = Machine Learning: the computer learns from data instead of following only hand-written rules. A pre-trained model is used.
about.ml.where=Where is ML used in this project? When finding “conflict candidates”, we measure how similar two requirements are. Similarity can be computed in two ways:
about.ml.ml=With ML (word embeddings): words are turned into vectors that were learned from large text data. Sentence = average of word vectors; the closer two sentences in this space, the higher the similarity. So similarity here uses learned representations — that is ML.
about.ml.tfidf=With TF-IDF (not ML): a simple formula based on word frequency. No learned model; used as fallback.
about.ml.how=How can you tell if ML is on? Check the badge at the top: “Similarity: ML (word embeddings)” means ML is active; “TF-IDF” means the fallback is used.

about.ml.why.title=Why is ML needed in this project?
about.ml.why.1=Requirements can be written in many different ways. Purely rule-based similarity (e.g. comparing exact words) often misses pairs that mean the same thing or contradict each other when phrased differently. ML word embeddings capture meaning, so we can find similar or conflicting requirements even when the wording is different.
about.ml.why.2=Without ML we would rely only on word overlap (TF-IDF). That works to some extent but is weaker for semantic similarity. With ML, similarity is based on learned representations, which improves the quality of conflict candidates and helps reduce both missed conflicts and false alarms.

about.project.title=About the project — Aims and what it does
about.project.aim=Aim: to flag ambiguous phrases and inconsistent or conflicting requirement pairs in software requirement documents. Final decision stays with human review.
about.project.done=What was done?
about.project.amb=Ambiguity (rule-based): “shall / should / may”, numbers, weak wording → score and reasons.
about.project.conf=Inconsistency (ML + rules): similarity via ML or TF-IDF; negation/number rules → conflict candidates.
about.project.web=Web UI: paste text or upload CSV, TXT, DOC, DOCX, PDF; view results in tables and download as CSV.

