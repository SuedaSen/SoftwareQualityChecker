about.ml.title=ML (Makine Öğrenmesi) nedir? — Sıfırdan kısa açıklama
about.ml.def=ML = Makine Öğrenmesi: bilgisayarın veriden öğrenerek iş yapmasıdır. Elle yazılan kurallar yerine, daha önce eğitilmiş bir model kullanılır.
about.ml.where=Bu projede ML nerede kullanılıyor? “Tutarsızlık adayları” bulunurken iki gereksinim ne kadar benzer diye bakıyoruz. Benzerlik iki şekilde hesaplanabiliyor:
about.ml.ml=ML ile (kelime vektörü): kelimeler, büyük metin verilerinden öğrenilmiş sayı listelerine (vektörlere) dönüştürülmüş. Cümle = kelimelerin ortalaması; iki cümle ne kadar yakınsa benzerlik o kadar yüksek. Yani benzerlik öğrenilmiş temsillerle hesaplanıyor → bu ML kullanımıdır.
about.ml.tfidf=TF-IDF ile (ML değil): sadece kelime sıklığına dayalı basit formül. Öğrenen model yok; yedek olarak kullanılır.
about.ml.how=ML kullanıldığını nasıl anlarsınız? Sayfanın üstündeki etikete bakın: “ML (kelime vektörü) ile hesaplanıyor” ML açık; “TF-IDF ile hesaplanıyor” yedek yöntem kullanılıyor.

about.ml.why.title=Bu projede ML’e neden ihtiyaç var?
about.ml.why.1=Gereksinimler çok farklı şekillerde yazılabilir. Sadece kural tabanlı benzerlik (örn. aynı kelimeleri karşılaştırmak), farklı ifade edilmiş aynı anlamlı veya birbirine zıt çiftleri sıklıkla kaçırır. ML kelime vektörleri anlamı yakaladığı için, ifade farklı olsa bile benzer veya çakışan gereksinimleri bulabiliyoruz.
about.ml.why.2=ML olmadan sadece kelime örtüşmesine (TF-IDF) güveniriz. Bu kısmen işe yarar ama anlamsal benzerlik için zayıftır. ML ile benzerlik öğrenilmiş temsillere dayanır; bu da tutarsızlık adaylarının kalitesini artırır ve hem kaçan çakışmaları hem gereksiz uyarıları azaltmaya yardımcı olur.

about.project.title=Proje hakkında — Amaçlar ve ne yapar?
about.project.aim=Amaç: yazılım gereksinim dokümanlarındaki belirsiz ifadeleri ve tutarsız/çakışan gereksinim çiftlerini aday olarak işaretlemek. Son karar insan incelemesine bırakılır.
about.project.done=Ne yapıldı?
about.project.amb=Belirsizlik (kural tabanlı): “shall / should / may”, sayılar, zayıf ifadeler → skor ve gerekçe.
about.project.conf=Tutarsızlık (ML + kurallar): benzerlik ML veya TF-IDF ile; olumsuzluk/sayı kuralları → çakışma adayları.
about.project.web=Web arayüzü: metin yapıştırma veya CSV, TXT, DOC, DOCX, PDF yükleme; sonuçları tabloda görüntüleme ve CSV indirme.

